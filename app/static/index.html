uvicorn app.main:app --reload --port 8000<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Detector</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
  h1 { margin-bottom: 4px; }
  .muted { color: #6b7280; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-top: 20px; }
  textarea { width: 100%; height: 160px; font-family: monospace; box-sizing: border-box; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
  .verdict { font-size: 22px; font-weight: 700; }
  .SAFE { color: #15803d; } .SUSPICIOUS { color: #b45309; } .PHISHING { color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
</style>
</head>
<body>
<h1>Phishing Detector</h1>
<p class="muted">Upload an .eml file or paste raw email content.</p>

<div class="card">
  <input type="file" id="file" accept=".eml,.txt">
  <p class="muted">or paste the email:</p>
  <textarea id="text" placeholder="From: ...&#10;Subject: ...&#10;&#10;Body..."></textarea>
  <p><button id="scan">Scan email</button></p>
</div>

<div class="card" id="result" hidden>
  <div class="verdict" id="verdict"></div>
  <p class="muted" id="meta"></p>
  <ul id="findings"></ul>
</div>

<div class="card">
  <h2>History</h2>
  <table>
    <thead><tr><th>When (UTC)</th><th>Source</th><th>Verdict</th><th>Score</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function scan() {
  const form = new FormData();
  const file = $("file").files[0];
  if (file) {
    form.append("file", file);
  } else if ($("text").value.trim()) {
    form.append("file", new Blob([$("text").value]), "pasted.eml");
  } else {
    alert("Choose a file or paste an email first.");
    return;
  }

  const res = await fetch("/api/scan", { method: "POST", body: form });
  if (!res.ok) {
    alert("Scan failed: " + (await res.text()));
    return;
  }
  showResult(await res.json());
  loadHistory();
}

function showResult(r) {
  $("result").hidden = false;
  $("verdict").textContent = `${r.verdict} (${r.score}/100)`;
  $("verdict").className = "verdict " + r.verdict;
  $("meta").textContent = `From: ${r.from ?? "-"} | Subject: ${r.subject ?? "-"}`;
  const items = r.findings.length
    ? r.findings.sort((a, b) => b.points - a.points).map(f => li(`+${f.points} (${f.check}) ${f.reason}`))
    : [li("No phishing indicators detected.")];
  $("findings").replaceChildren(...items);
}

function li(text) {
  const el = document.createElement("li");
  el.textContent = text;
  return el;
}

async function loadHistory() {
  const rows = await (await fetch("/api/history")).json();
  $("history").replaceChildren(...rows.map(r => {
    const tr = document.createElement("tr");
    for (const value of [r.scanned_at.slice(0, 19).replace("T", " "), r.source, r.verdict, r.score]) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
    return tr;
  }));
}

$("scan").addEventListener("click", scan);
loadHistory();
</script>
</body>
</html>
